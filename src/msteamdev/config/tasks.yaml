# src/msteamdev/config/tasks.yaml
# Defines tasks for the IT alert management system.
# Each task has a description, expected output, and assigned agent.

recommend_actions:
  description: >
    Analyze the alert with title "{title}", severity "{severity}", metric "{metric}", and incident number "{incident_number}".
    Suggest up to 3 specific actions to address it, tailored to the alert's context.
  expected_output: >
    A list of up to 3 recommended actions
  agent: action_recommender
  output_pydantic: src.msteamdev.tools.notify.RecommendedActions

evaluate_escalation:
  description: >
    Evaluate whether the alert should be escalated based on severity, timing, and suppression rules.
  expected_output: >
    Respond with either "Yes, escalate" or "No, suppress" and include a brief explanation.
  agent: escalation_checker

notify_bau:
  description: >
    Compose a professional email for alert escalation with details:
    - Title: {title}
    - Severity: {severity}
    - Metric: {metric}
    - Incident Number: {incident_number}
    - Reason: {reason}
    - Recommended Actions:
      {recommended_actions}
    Output a structured response with subject and body fields, 
    ensuring special characters (e.g., backslashes, newlines) are properly handled.

    The body should end with the following sign-off:
    "Best regards,
    CrewAI Alerting System
    Managed Service Team"
    ensuring newline are properly formatted for signature.
  expected_output: >
    A structured object with email subject and body, formatted as:
      subject: ""
      body: ""
    
    Draft an email message for the BAU team, or clearly state if escalation was not approved.
  agent: communicator
  output_pydantic: src.msteamdev.tools.notify.EmailContent

shift_report:
  description: >
    Generate a professional shift report email for the NOC team.

    SHIFT INFORMATION:
    - Shift period: {shift_start} to {shift_end} (+08)
    - Shift type: {shift_type}

    ALERT STATISTICS:
    - Total Alerts: {total_alerts}
    - Critical Alerts: {critical_alerts}
    - Warning Alerts: {warning_alerts}
    - Resolved Alerts: {resolved_alerts}
    - Escalated Alerts: {escalated_alerts}

    ALERT DETAILS:
    {alert_details}

    REQUIREMENTS:
    1. Create a professional email subject that includes the shift period and type
    2. Write a comprehensive email body that includes:
       - Professional greeting
       - Shift period and type
       - Summary statistics (total, critical, warning, resolved, escalated alerts)
       - Detailed alert information in a clear, readable format
       - Professional closing with instructions to review unresolved incidents
       - Note to contact the managed service team for issues
    3. Use proper line breaks (\n) for email formatting
    4. Ensure have proper numbering or point with line breaks if using it
    5. Keep the tone professional and informative
    6. Signoff should be formatted as follows:
        Best regards
        CrewAI Shift Reporting System
        Managed Service Team
  expected_output: >
    A JSON object containing the email subject and body, formatted exactly as:
      {
        "subject": "<Your Subject Here>",
        "body": "<Your Email Body Here>"
      }
  agent: reporter
  output_pydantic: src.msteamdev.models.ShiftReportOutput


check_and_acknowledge_alert:
  description: >
    Manage PagerDuty incident lifecycle for incident {incident_number}:
    
    Workflow:
    1. Wait for the configured acknowledgment delay
    2. Check current incident status using GetIncidentStatus
    3. If status is 'triggered', acknowledge using AcknowledgeIncident
    4. Update internal tracking and cache
    5. Log all actions for audit trail
    
    Error Handling:
    - Retry on transient API failures
    - Log all API interactions
    - Update Redis cache appropriately
    - Handle rate limiting gracefully
    
    Success Criteria:
    - Incident successfully acknowledged in PagerDuty
    - Internal state updated correctly
    - Audit log entries created
  expected_output: >
    Status report containing:
    - Current incident status
    - Acknowledgment result (if performed)
    - API interaction summary
    - Any errors or warnings
    - Next recommended actions
  agent: pagerduty_manager
  context: []
output_pydantic: src.msteamdev.models.IncidentManagementResult