# Enhanced Tasks Configuration - Compatible with crew_enhanced_v2.py
# Improved task definitions while maintaining your current pipeline flow

recommend_actions:
  description: >
    Analyze the alert with title "{title}", severity "{severity}", metric "{metric}", and incident number "{incident_number}".
    Generate specific, actionable remediation steps for this IT alert based on the severity, affected systems, 
    and proven troubleshooting methodologies. Focus on practical solutions that can be implemented quickly.
    
    Provide 2-3 specific actions to address it, tailored to the alert's context and severity level.
    For each step, provide a detailed breakdown including:
    - A clear description of the action.
    - A priority level (1-5).
    - Estimated time to complete in minutes.
    - A list of required tools or access permissions.
    - Concrete success criteria to verify completion.
  expected_output: >
    A Pydantic object containing a list of 2 to 3 technical actions. Each action must include:
    - description: A clear, concise description of the action.
    - priority_level: An integer from 1 (lowest) to 5 (highest).
    - estimated_time_minutes: An integer representing the completion time.
    - required_tools: A list of strings naming necessary tools.
    - success_criteria: A string describing how to verify the action was successful.
  agent: action_recommender
  output_pydantic: src.msteamdev.models.RecommendedActions

evaluate_escalation:
  description: >
    Evaluate whether the alert should be escalated to the BAU team based on severity, timing, suppression rules,
    and business impact. Use the available tools to check alert history and escalation patterns.
    
    Alert Context:
    - Title: {title}
    - Severity: {severity}
    - Incident: {incident_number} 
    - Timestamp: {timestamp}
    - Metric: {metric}
    
    Decision Criteria:
    1. Check suppression windows (3 days for critical/high/medium/low, 5 days for warning)
    2. Verify if similar alerts are already being handled
    3. Assess business hours vs after-hours impact
    4. Consider alert frequency and pattern changes
    5. Review recent escalation history for similar issues
    
    Use the ReadAlertLog, ReadEscalationLog, and GetMatchingAlerts tools to investigate further if needed.
    Your decision must be data-driven and clearly justified.
  expected_output: >
    Respond with either "Yes, escalate" or "No, suppress" and include a detailed explanation
    of the decision based on the alert analysis and historical data.
  agent: escalation_checker
output_pydantic: src.msteamdev.models.EscalationDecision

notify_bau:
  description: >
    Compose a professional email for alert escalation with details:
    - Title: {title}
    - Severity: {severity}
    - Metric: {metric}
    - Incident Number: {incident_number}
    - Reason: {reason}
    - Recommended Actions: {recommended_actions}
    
    Create a structured email notification that provides all necessary context for rapid incident response.
    Use appropriate urgency indicators for the severity level and ensure the message is clear and actionable.
    
    The body should end with the following sign-off:
    "Best regards,
    CrewAI Alerting System
    Managed Service Team"
    ensuring newlines are properly formatted for signature.
  expected_output: >
    A structured object with email subject and body, formatted as:
      subject: ""
      body: ""
    
    Draft a professional email message for the BAU team, or clearly state if escalation was not approved.
    Ensure special characters (e.g., backslashes, newlines) are properly handled.
  agent: communicator
  output_pydantic: src.msteamdev.models.EmailContent

shift_report:
  description: >
    Generate an enhanced professional shift report email for NOC team management.

    SHIFT CONTEXT:
    - Period: {shift_start} to {shift_end} (+08)
    - Type: {shift_type}
    - Timezone: Asia/Singapore
    - Operating Environment: Production NOC

    PERFORMANCE METRICS:
    - Total Alerts: {total_alerts}
    - Critical Alerts: {critical_alerts}
    - Warning Alerts: {warning_alerts}
    - Resolved Alerts: {resolved_alerts}
    - Escalated Alerts: {escalated_alerts}

    DETAILED ALERT DATA:
    {alert_details}

    REPORT STRUCTURE REQUIREMENTS:

    1. Enhanced Subject Line:
       Format: "📊 NOC {shift_type} Shift Report ({shift_start} - {shift_end} +08)"
       Include priority indicators for critical situations

    2. Enhanced Email Structure:
       a) Professional Introduction:
          - Formal greeting
          - Shift period overview with timezone
          - Executive summary of key events

       b) Performance Analysis:
          - Statistical breakdown of alerts
          - Trend comparison with previous shifts
          - Key performance indicators
          - Resolution efficiency metrics

       c) Critical Situations Overview:
          - High-priority incidents
          - Current status and impact
          - Actions taken and results
          - Pending resolutions

       d) Detailed Alert Analysis:
          For each alert, provide:
          - Incident Number and Title
          - Severity and Current Status
          - Timestamp and Duration
          - Escalation Status and Reasoning
          - Resolution Status or Next Steps
          Group by severity and status for clarity

       e) Risk Assessment:
          - Current system health status
          - Potential emerging issues
          - Recommendations for monitoring
          - Areas needing attention

       f) Handover Information:
          - Ongoing critical situations
          - Required follow-up actions
          - Special monitoring requirements
          - Escalation thresholds to watch

       g) Professional Closing:
          - Summary of key action items
          - Contact information for issues
          - Standard signature block

    3. Enhanced Formatting Requirements:
       - Proper section spacing using 

       - Consistent bullet point formatting
       - Clear section headers
       - Professional tone throughout
       - Proper timestamp formatting in +08
       - Structured layout for readability

    4. Signature Block:
       "Best regards,
       CrewAI Shift Reporting System
       Managed Service Team"

    Must return valid ShiftReportOutput with properly formatted subject and body.
  expected_output: >
    A professional and comprehensive shift report formatted as a ShiftReportOutput object with:
    - subject: Clear and informative email subject line with proper indicators
    - body: Well-structured email body with all required sections and proper formatting
  agent: reporter
  context: []
  output_pydantic: src.msteamdev.models.ShiftReportOutput

check_and_acknowledge_alert:
  description: >
    Manage PagerDuty incident lifecycle for incident {incident_number}:
    
    Workflow:
    1. Wait for the configured acknowledgment delay
    2. Check current incident status using GetIncidentStatus
    3. If status is 'triggered', acknowledge using AcknowledgeIncident
    4. Update internal tracking and cache
    5. Log all actions for audit trail
    
    Error Handling:
    - Retry on transient API failures
    - Log all API interactions
    - Update Redis cache appropriately
    - Handle rate limiting gracefully
    
    Success Criteria:
    - Incident successfully acknowledged in PagerDuty
    - Internal state updated correctly
    - Audit log entries created
  expected_output: >
    Status report containing:
    - Current incident status
    - Acknowledgment result (if performed)
    - API interaction summary
    - Any errors or warnings
    - Next recommended actions
  agent: pagerduty_manager
  context: []
  output_pydantic: src.msteamdev.models.IncidentManagementResult