# Enhanced Tasks Configuration - Compatible with crew_enhanced_v2.py
# Improved task definitions while maintaining your current pipeline flow

recommend_actions:
  description: >
    Analyze the alert with title "{title}", priority "{priority}", metric "{metric}", and incident number "{incident_number}".
    Generate specific, actionable remediation steps for this IT alert based on the priority, affected systems, 
    and proven troubleshooting methodologies. Focus on practical solutions that can be implemented quickly.
    
    Provide 2-3 specific actions to address it, tailored to the alert's context and priority level.
    For each step, provide a detailed breakdown including:
    - A clear description of the action.
    - A priority level (1-5).
    - Estimated time to complete in minutes.
    - A list of required tools or access permissions.
    - Concrete success criteria to verify completion.
  expected_output: >
    A Pydantic object containing a list of 2 to 3 technical actions. Each action must include:
    - description: A clear, concise description of the action.
    - priority_level: An integer from 1 (lowest) to 5 (highest).
    - estimated_time_minutes: An integer representing the completion time.
    - required_tools: A list of strings naming necessary tools.
    - success_criteria: A string describing how to verify the action was successful.
  agent: action_recommender
  output_pydantic: src.msteamdev.models.RecommendedActions

evaluate_escalation:
  description: >
    Analyze the provided alert and knowledge base context to provide a detailed escalation analysis.
    Your goal is to provide a rich analysis that will be used by a decision-making framework.

    **Alert Context:**
    - Title: {title}
    - Priority: {priority}
    - Incident: {incident_number}
    - Timestamp: {timestamp}
    - Metric: {metric}

    **Your Task:**

    1.  **Summarize the situation:** Briefly describe the alert and the key findings from the "KNOWLEDGE BASE INSIGHTS" provided in the context.
    2.  **Assess the data:** Comment on the freshness of the knowledge base data (using the "last updated" information).
    3.  **Provide a recommendation:** Based on your analysis, recommend a course of action. Your recommendation should be one of: "escalate", "suppress", or "investigate_further".
    4.  **Justify your recommendation:** Provide a clear and concise justification for your recommendation, referencing specific details from the knowledge base.

    Your entire response should be a single, coherent block of text that will be used as input for a final decision-making framework.
  expected_output: >
    A detailed analysis of the alert, including a summary of the situation, an assessment of the knowledge base data, a clear recommendation ("escalate", "suppress", or "investigate_further"), and a justification for the recommendation.
  agent: escalation_checker

notify_bau:
  description: >
    Compose a professional email for alert escalation with details:
    - Title: {title}
    - Priority: {priority}
    - Metric: {metric}
    - Incident Number: {incident_number}
    - Reason: {reason}
    - Recommended Actions: {recommended_actions}
    
    Create a structured email notification that provides all necessary context for rapid incident response.
    Use appropriate urgency indicators for the priority level and ensure the message is clear and actionable.
    
    The body should end with the following sign-off:
    "Best regards,
    CrewAI Alerting System
    Managed Service Team"
    ensuring newlines are properly formatted for signature.
  expected_output: >
    A structured object with email subject and body, formatted as:
      subject: ""
      body: ""
    
    Draft a professional email message for the BAU team, or clearly state if escalation was not approved.
    Ensure special characters (e.g., backslashes, newlines) are properly handled.
  agent: communicator
  output_pydantic: src.msteamdev.models.EmailContent

shift_report:
  description: >
    Generate an enhanced professional shift report email for NOC team management,
    following ITIL best practices for daily handover.

    SHIFT CONTEXT:
    - Period: {shift_start} to {shift_end} (+08)
    - Type: {shift_type}
    - Timezone: Asia/Kuala_Lumpur (MYT +08)
    - Operating Environment: Production NOC

    PERFORMANCE METRICS (Shift-Specific):
    - Total Alerts: {total_alerts}
    - Unique Incidents: {unique_alerts}
    - Critical Alerts: {critical_alerts}
    - Warning Alerts: {warning_alerts}
    - Resolved Alerts: {resolved_alerts}
    - Acknowledged Alerts: {acknowledged_alerts}
    - Escalated Alerts: {escalated_alerts}
    
    KEY PERFORMANCE INDICATORS:
    - Mean Time to Acknowledge (MTTA): {mttr_acknowledge}
    - Mean Time to Resolve (MTTR): {mttr_resolve}
    - Escalation Rate: {escalation_rate}
    - Resolution Rate: {resolution_rate}
    - Acknowledgment Rate: {acknowledgment_rate}
    - KPI Compliance: {kpi_compliance} (Acknowledgment compliance)
    - KPI Breaches: {kpi_breaches}
    - Priority Distribution: {priority_distribution}
    - P1 KPI Compliance: {p1_kpi_compliance} (Critical alerts - 5min threshold)
    - P2 KPI Compliance: {p2_kpi_compliance} (High priority alerts - 10min threshold)
    - P3 KPI Compliance: {p3_kpi_compliance} (Medium priority alerts - 15min threshold)
    - P4 KPI Compliance: {p4_kpi_compliance} (Low priority alerts - 20min threshold)

    ALERT DETAILS (JSON format for structured parsing):
    {alert_details}

    ACTIVE INCIDENTS TO HANDOVER:
    {active_incidents_data}

    RESOLVED INCIDENTS (DURING SHIFT):
    {resolved_incidents_data}

    REPORT STRUCTURE REQUIREMENTS:

    1. Enhanced Subject Line:
       REQUIRED FORMAT: "{report_status_emoji} NOC {shift_type} Shift Report | {report_date} | {total_alerts} Total | {resolved_alerts} Resolved | {escalated_alerts} Escalated"
       
       Status Emoji Guide:
       - 🟢 GREEN: No critical alerts, <2 escalations
       - 🟡 AMBER: 3-4 critical alerts OR 2-3 escalations
       - 🔴 RED: ≥5 critical alerts OR ≥3 escalations

    2. Enhanced Email Body Structure:
    
       a) EXECUTIVE SUMMARY (First paragraph):
          - Professional greeting: "Dear NOC Management Team,"
          - Shift overview: "This report provides a comprehensive overview of the Production NOC {shift_type} shift operations for the period of {shift_start} to {shift_end} (+08) in the Asia/Kuala_Lumpur timezone."
          - Overall Status: {report_status_text}
          - Critical actions needed: 0-3 specific actionable items based on active critical/escalated alerts
          - Shift performance assessment: "Meeting KPIs" / "Below KPIs" / "Exceeding KPIs"
            * Meeting KPIs: Resolution rate >80%, KPI compliance >90% (P1: 5min, P2: 10min, P3: 15min, P4: 20min thresholds)
            * Below KPIs: Resolution rate <80% OR KPI compliance <90%
            * Exceeding KPIs: Resolution rate >95%, KPI compliance >95%

       b) PERFORMANCE ANALYSIS:
          Title: "**Performance Analysis:**"
          
          Content to include:
          - Opening statement about shift stability/activity level
          - Statistical breakdown by severity:
            * Total Alerts (Shift-specific): {total_alerts}
            * Unique Incidents: {unique_alerts}
            * Critical Alerts: {critical_alerts}
            * Warning Alerts: {warning_alerts}
            * Resolved Alerts: {resolved_alerts}
            * Escalated Alerts: {escalated_alerts}
          
          - Key Performance Indicators table:
            ```
            - Mean Time to Acknowledge (MTTA): {mttr_acknowledge}
            - Mean Time to Resolve (MTTR): {mttr_resolve}
            - Escalation Rate: {escalation_rate}
            - Resolution Rate: {resolution_rate}
            - Acknowledgment Rate: {acknowledgment_rate}
            - KPI Compliance: {kpi_compliance} (Acknowledgment compliance)
            - Priority Distribution: {priority_distribution}
            - P1 KPI Compliance: {p1_kpi_compliance} (Critical alerts - 5min threshold)
            - P2 KPI Compliance: {p2_kpi_compliance} (High priority alerts - 10min threshold)
            - P3 KPI Compliance: {p3_kpi_compliance} (Medium priority alerts - 15min threshold)
            - P4 KPI Compliance: {p4_kpi_compliance} (Low priority alerts - 20min threshold)
            ```
          
          - Brief analysis of trends (if GetAlertTrends tool was used)

       c) ACTIVE INCIDENTS (HANDOVER):
          Title: "**Active Incidents (Handover):**"
          
          Parse the active_incidents_data provided above. If active incidents exist:
          - Group by priority: P1 (Critical), P2 (High), P3 (Medium), P4 (Low)
          - For each incident, extract from the JSON data and present as:
            - Incident #[number]: [title]
              * Priority: [priority level]
              * Status: [current status]
              * Timestamp: [formatted timestamp]
              * Escalation: [escalation status]
              * Reason: [escalation reason]
              * Category: [category if available]
              * Priority: [priority if available]
              * Suspected Root Cause: [root cause if available]
              * Problem ID: [problem ID if available]
              * Immediate Actions: [Derive 1-2 specific actions based on alert context]
          
          If no active incidents or active_incidents_data shows "No active incidents":
          - State: "No active incidents to hand over to the incoming shift."

       d) RESOLVED INCIDENTS (DURING SHIFT):
          Title: "**Resolved Incidents (During Shift):**"
          
          Parse the resolved_incidents_data provided above. If resolved incidents exist:
          - Group by priority
          - For each resolved incident, extract from the JSON data and present as:
            - Incident #[number]: [title]
              * Priority: [priority level]
              * Status: [current status]
              * Timestamp: [formatted timestamp]
              * Time to Resolve: [Calculate from alert_details JSON if timestamps available]
              * Resolution verified: Yes (status is resolved)
          
          If no resolved incidents or resolved_incidents_data shows "No resolved incidents":
          - State: "No incidents were resolved during this shift."

       e) RISK ASSESSMENT (ITIL Problem Management & CSI):
          Title: "**Risk Assessment (ITIL Problem Management & CSI):**"
          
          Use GetAlertTrends tool if available to analyze:
          - Emerging Alert Patterns/Anomalies:
            * Look for repeated alerts on same metric
            * Identify hourly distribution patterns
            * Note alert velocity trends
          
          - Potential emerging issues:
            * Flag if same incident number has multiple triggers
            * Identify patterns in unresolved incidents
          
          - Recommendations:
            * Proactive monitoring suggestions based on alert patterns
            * Alert tuning opportunities (if seeing noise)
            * Automation opportunities (if manual interventions are repeated)
          
          - CSI Improvements:
            * Process improvements based on MTTR/MTTA
            * Knowledge base gaps identified
            * Tool/integration improvements needed

       f) HANDOVER INFORMATION (ITIL Service Operation):
          Title: "**Handover Information (ITIL Service Operation):**"
          
          - Summary of ongoing critical situations:
            * List any P1/P2 active incidents
            * Clear ownership assignment (incoming shift)
            * Next steps for each critical incident
          
          - Required follow-up actions:
            * Specific tasks for incoming shift (3-5 actionable items max)
            * Priority order for follow-ups
          
          - Special monitoring requirements:
            * Specific metrics/thresholds to watch (e.g., "Monitor network utilization on Synergi CORE Prod")
            * Conditions that would require escalation
          
          - Escalation thresholds:
            * When to escalate to management
            * When to engage on-call resources
          
          - Recent changes impact:
            * Note any deployments/changes during shift (if available in context)
            * Impact assessment of changes

       g) DATA QUALITY INDICATORS:
          Title: "**Data Quality Indicators:**"
          
          Note: ReportMetadata is auto-populated by the framework. Include these indicators:
          - Report Generated: [Current timestamp in ISO format]
          - Data Freshness: real-time (if tools worked) or fallback (if tools failed)
          - Alerts Source: Unified Alerting System
          - Completeness Score: 1.0 (if all data available) or 0.7 (if limited data)
          - Known Limitations: List any data gaps or tool failures encountered
          
          Important: If you successfully used GetAlertTrends tool, 
          note "Data freshness: real-time". If tools failed, note the limitations.

       h) PROFESSIONAL CLOSING:
          - Summary of key action items (2-3 bullets max)
          - Contact information: "Please review any unresolved incidents and contact the managed service team for any issues or concerns."
          - Signature block (EXACTLY as shown):
            ```
            Best regards,
            CrewAI Shift Reporting System
            Managed Service Team
            ```

    3. FORMATTING REQUIREMENTS:
       - Use proper line breaks between sections (double newline)
       - Section headers in **bold** using **Header:**
       - Bullet points with consistent indentation (2 spaces for sub-bullets)
       - Timestamp format: YYYY-MM-DD HH:MM:SS (in +08 timezone)
       - Keep professional tone throughout
       - No markdown headers (no # symbols), use **bold** for emphasis only
       - Keep total email length reasonable (aim for 300-500 lines max)

    4. IMPORTANT NOTES:
       - The alert_details JSON contains the raw alert data for your analysis
       - Parse this JSON to extract specific incident information
       - Use GetAlertTrends to enrich your analysis with alert patterns
       - If tools return errors, acknowledge limitations in Data Quality Indicators
       - Focus on actionable insights, not just data regurgitation
       - Maintain ITIL terminology (Incident, Problem, Change, Service)
       - Prioritize clarity and usefulness for the incoming shift team

  expected_output: >
    A ShiftReportOutput Pydantic object containing:
    
    1. subject (str): 
       - MUST follow exact format: "{emoji} NOC {Shift Type} Shift Report | {Date} | {Total} Total | {Resolved} Resolved | {Escalated} Escalated"
       - Example: "🟢 NOC Morning Shift Report | 2025-10-21 | 1 Total | 1 Resolved | 0 Escalated"
    
    2. body (str): 
       - Complete email body with all sections as specified
       - Proper formatting with line breaks and structure
       - Professional tone throughout
       - MUST end with the exact signature block:
         "Best regards,
         CrewAI Shift Reporting System
         Managed Service Team"
    
    3. metadata (ReportMetadata): 
       - Auto-populated by the framework based on:
         * generation_timestamp: Current UTC timestamp
         * alert_count: Number of alerts processed
         * critical_alerts: Count of critical priority alerts
         * kpi_breaches: Count of incidents exceeding KPI
         * mttr_minutes: Mean time to resolution in minutes
       - You don't need to manually create this; it's injected by the reporting system

  agent: reporter
  context: []
  output_pydantic: src.msteamdev.models.ShiftReportOutput

check_and_acknowledge_alert:
  description: >
    Manage PagerDuty incident lifecycle for incident {incident_number}:
    
    Workflow:
    1. Wait for the configured acknowledgment delay
    2. Check current incident status using GetIncidentStatus
    3. If status is 'triggered', acknowledge using AcknowledgeIncident
    4. Update internal tracking and cache
    5. Log all actions for audit trail
    
    Error Handling:
    - Retry on transient API failures
    - Log all API interactions
    - Update Redis cache appropriately
    - Handle rate limiting gracefully
    
    Success Criteria:
    - Incident successfully acknowledged in PagerDuty
    - Internal state updated correctly
    - Audit log entries created
  expected_output: >
    Status report containing:
    - Current incident status
    - Acknowledgment result (if performed)
    - API interaction summary
    - Any errors or warnings
    - Next recommended actions
  agent: pagerduty_manager
  context: []
  output_pydantic: src.msteamdev.models.IncidentManagementResult

weekly_report:
  description: >
    Generate a comprehensive weekly NOC report for management, providing strategic insights and operational analysis across the entire week.
    
    WEEKLY CONTEXT:
    - Period: {week_start} to {week_end}
    - Total Shifts Analyzed: {total_shifts}
    - Report Type: Weekly Strategic Analysis
    - Operating Environment: Production NOC
    
    WEEKLY PERFORMANCE METRICS:
    - Total Alerts: {total_alerts}
    - Total Incidents: {total_incidents}
    - Total Resolved: {total_resolved}
    - Total Acknowledged: {total_acknowledged}
    - Total Critical: {total_critical}
    - Total Warning: {total_warning}
    - Total Escalated: {total_escalated}
    
    WEEKLY AVERAGE METRICS:
    - Average MTTA: {avg_mtta_minutes:.1f}m
    - Average MTTR: {avg_mttr_minutes:.1f}m
    - Average Resolution Rate: {avg_resolution_rate:.1f}%
    - Average Acknowledgment Rate: {avg_acknowledgment_rate:.1f}%
    - Average Escalation Rate: {avg_escalation_rate:.1f}%
    
    WEEKLY KPI ANALYSIS:
    - Average KPI Compliance: {avg_kpi_compliance:.1f}% (MTTA - 5min threshold)
    - Total KPI Breaches: {total_kpi_breaches}
    - Average P2 KPI Compliance: {avg_p2_kpi_compliance:.1f}% (Critical - 8h resolution)
    - Average P3 KPI Compliance: {avg_p3_kpi_compliance:.1f}% (Warning - 24h resolution)
    
    DAILY BREAKDOWN DATA:
    {daily_breakdown_data}
    
    TREND ANALYSIS DATA:
    {trend_analysis_data}
    
    WEEKLY PERFORMANCE ASSESSMENT:
    - Overall Performance: {performance_status}
    - Performance Grade: {performance_grade}
    
    REPORT STRUCTURE REQUIREMENTS:
    
    1. Enhanced Subject Line:
       REQUIRED FORMAT: "{performance_emoji} NOC Weekly Report | {week_start} to {week_end} | {total_alerts} Alerts | {performance_grade} Performance"
    
    2. Enhanced Email Body Structure:
    
       a) EXECUTIVE SUMMARY:
          - Professional greeting: "Dear NOC Management Team,"
          - Weekly overview: "This comprehensive weekly report analyzes NOC operations for the period of {week_start} to {week_end}, covering {total_shifts} shifts and {total_alerts} total alerts."
          - Overall Performance: {performance_status} ({performance_grade})
          - Key Highlights: 3-5 most significant findings or achievements
          - Critical Issues: Any ongoing or recurring problems requiring attention
    
       b) WEEKLY PERFORMANCE ANALYSIS:
          Title: "**Weekly Performance Analysis:**"
          
          Content to include:
          - Operational Overview: Summary of week's activity level and stability
          - Statistical Summary:
            * Total Alerts Processed: {total_alerts}
            * Total Incidents Managed: {total_incidents}
            * Resolution Success Rate: {avg_resolution_rate:.1f}%
            * KPI Compliance: {avg_kpi_compliance:.1f}%
            * Escalation Rate: {avg_escalation_rate:.1f}%
          
          - Performance Trends Analysis:
            * Alert Volume Trends: {alert_volume_trend}
            * KPI Compliance Trends: {kpi_compliance_trend}
            * Resolution Rate Trends: {resolution_rate_trend}
            * Critical Alert Patterns: {critical_alert_analysis}
    
       c) DAILY PERFORMANCE BREAKDOWN:
          Title: "**Daily Performance Breakdown:**"
          
          Analyze the daily_breakdown_data to provide:
          - Day-by-day performance summary
          - Peak and low activity days
          - Daily KPI compliance variations
          - Notable incidents or patterns by day
          - Weekend vs weekday performance comparison (if applicable)
    
       d) KPI COMPLIANCE DEEP DIVE:
          Title: "**KPI Compliance Analysis:**"
          
          - Overall KPI Performance: {avg_kpi_compliance:.1f}% vs Target (90%)
          - P2 KPI Performance: {avg_p2_kpi_compliance:.1f}% vs Target (90%)
          - P3 KPI Performance: {avg_p3_kpi_compliance:.1f}% vs Target (90%)
          - Total KPI Breaches: {total_kpi_breaches}
          - Breach Analysis: Identify patterns in KPI breaches
          - Improvement Opportunities: Specific recommendations for KPI improvement
    
       e) OPERATIONAL INSIGHTS & RECOMMENDATIONS:
          Title: "**Operational Insights & Strategic Recommendations:**"
          
          - Process Improvements:
            * Based on MTTA/MTTR analysis, identify bottlenecks
            * Recommend process optimizations
            * Suggest automation opportunities
          
          - Resource Optimization:
            * Analyze escalation patterns for resource allocation
            * Identify peak workload periods
            * Recommend staffing adjustments
          
          - Technology Enhancements:
            * Alert tuning opportunities based on patterns
            * Monitoring improvements
            * Tool integration recommendations
          
          - Risk Management:
            * Identify recurring critical issues
            * Proactive measures for common problems
            * Business continuity considerations
    
       f) WEEKLY TREND ANALYSIS:
          Title: "**Weekly Trend Analysis:**"
          
          Use trend_analysis_data to provide:
          - Alert Volume Trends: Peak days, patterns, anomalies
          - Performance Trends: Improving/declining metrics
          - Seasonal Patterns: Day-of-week effects, time-based patterns
          - Predictive Insights: What to expect next week
    
       g) STRATEGIC RECOMMENDATIONS:
          Title: "**Strategic Recommendations for Next Week:**"
          
          - Immediate Actions (1-3 items):
            * Address critical issues identified
            * Implement quick wins for KPI improvement
            * Resolve ongoing escalations
          
          - Medium-term Initiatives (1-3 items):
            * Process improvements
            * Training needs
            * Tool enhancements
          
          - Long-term Strategic Goals:
            * Performance targets for next month
            * Infrastructure improvements
            * Team development plans
    
       h) DATA QUALITY & REPORTING:
          Title: "**Data Quality & Reporting:**"
          
          - Report Generated: [Current timestamp]
          - Data Coverage: {total_shifts} shifts analyzed
          - Data Completeness: Assessment of data quality
          - Known Limitations: Any data gaps or issues
          - Next Report: Scheduled date for next weekly report
    
       i) PROFESSIONAL CLOSING:
          - Summary of key strategic priorities
          - Contact information for follow-up
          - Signature block:
            ```
            Best regards,
            CrewAI Weekly Reporting System
            NOC Management Team
            ```
    
    3. FORMATTING REQUIREMENTS:
       - Professional executive-level tone
       - Clear section headers with **bold** formatting
       - Bullet points for easy scanning
       - Charts/visual indicators where appropriate (use text-based representations)
       - Executive summary format suitable for C-level review
       - Keep total length reasonable (aim for 400-600 lines)
    
    4. IMPORTANT NOTES:
       - Focus on strategic insights rather than operational details
       - Provide actionable recommendations for management
       - Use trend analysis to predict future performance
       - Highlight both successes and areas for improvement
       - Maintain professional tone suitable for executive audience
       - Include specific metrics and targets for accountability
  expected_output: >
    A Pydantic object containing a comprehensive weekly report email with subject and body, providing strategic insights and operational analysis for NOC management.
  agent: reporter
  output_pydantic: src.msteamdev.models.ShiftReportOutput