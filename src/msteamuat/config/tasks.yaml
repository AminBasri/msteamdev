# src/msteamuat/config/tasks.yaml
# Defines tasks for the IT alert management system.
# Each task has a description, expected output, and assigned agent.

recommend_actions:
  description: >
    Analyze the alert with title "{title}", severity "{severity}", metric "{metric}", and incident number "{incident_number}".
    Suggest up to 3 specific actions to address it, tailored to the alert's context.
  expected_output: >
    A list of up to 3 recommended actions
  agent: action_recommender
  output_pydantic: src.msteamuat.tools.notify.RecommendedActions

evaluate_escalation:
  description: >
    Evaluate whether the alert should be escalated based on severity, timing, and suppression rules.
  expected_output: >
    Respond with either "Yes, escalate" or "No, suppress" and include a brief explanation.
  agent: escalation_checker

notify_bau:
  description: >
    Compose a professional email for alert escalation with details:
    - Title: {title}
    - Severity: {severity}
    - Metric: {metric}
    - Incident Number: {incident_number}
    - Reason: {reason}
    - Recommended Actions:
      {recommended_actions}
    Output a structured response with subject and body fields, 
    ensuring special characters (e.g., backslashes, newlines) are properly handled.

    The body should end with the following sign-off:
    "Best regards,
    CrewAI Alerting System
    Managed Service Team"
    ensuring newline are properly formatted for signature.
  expected_output: >
    A structured object with email subject and body, formatted as:
      subject: ""
      body: ""
    
    Draft an email message for the BAU team, or clearly state if escalation was not approved.
  agent: communicator
  output_pydantic: src.msteamuat.tools.notify.EmailContent

compose_email:
  description: >
    Compose a professional email for alert escalation with details:
    - Title: {title}
    - Severity: {severity}
    - Metric: {metric}
    - Incident Number: {incident_number}
    - Reason: {reason}
  expected_output: >
    A JSON object containing the email subject and body, formatted as:
      {
        "subject": "",
        "body": ""
      }
  agent: communicator

shift_report:
  description: >
    Generate a professional end-of-shift report in email body by summarizing all alerts from {shift_start} to {shift_end}.
    Summary statistics:
    - Total Alerts: {total_alerts}
    - Critical Alerts: {critical_alerts}
    - Warning Alerts: {warning_alerts}
    - Resolved Alerts: {resolved_alerts}
    - Escalated Alerts: {escalated_alerts}
    
    Alert Details:
    {alert_details}
    
    If no alerts are recorded, explicitly state: "No alerts recorded for this shift."

    The email must include both plain text and HTML versions. The HTML version should include:
    - Proper styling with CSS (Arial font, responsive design)
    - Tables for structured data with borders and padding
    - Color coding for severity levels (critical: #ffcccc, warning: #fff4cc)
    - Responsive design for mobile devices
    
    The report must follow this exact format:
    Subject: Shift Report - {shift_start} to {shift_end} (+08)
    Body:
      Dear Team,

      This is the shift report for {shift_start} to {shift_end} (+08).

      Summary:
      - Total Alerts: {total_alerts}
      - Critical Alerts: {critical_alerts}
      - Warning Alerts: {warning_alerts}
      - Resolved Alerts: {resolved_alerts}
      - Escalated Alerts: {escalated_alerts}

      Alert Details:
      {alert_details}

      Please review any unresolved incidents and contact the managed service team for issues.

      Signoff should be formatted as follows:
      Best regards,
      CrewAI Reporting System
      Managed Service Team
    
    Ensure special characters (e.g., backslashes, newlines) are properly escaped and handled.
    Ensure the alert details are formatted as a list with each alert on a new line, and make sure all fields are properly filled in.
    Output a structured response with subject, body, and html_body fields matching this format.
  expected_output: >
    A structured object containing the email subject, body, and html_body, formatted as:
      subject: ""
      body: ""
      html_body: ""
  agent: reporter
  output_pydantic: src.msteamuat.tools.custom_tool.ShiftReportOutput

check_and_acknowledge_alert:
  description: >
    Check the status of PagerDuty incident {incident_number} 5 minutes after receipt using the MCP GetIncidentStatus tool.
    If the status is 'triggered', acknowledge the incident using the MCP AcknowledgeIncident tool.
    Retrieve related alerts for context using the GetMatchingAlerts tool to inform escalation decisions.
  expected_output: >
    A JSON object containing:
    - status: The current status of the incident ('triggered', 'acknowledged', 'resolved', or 'error').
    - acknowledgment_result: Result of the acknowledgment action (if performed).
    - related_alerts: List of related alerts for the service within the past 1 hour.
  agent: pagerduty_manager